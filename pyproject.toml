[project]
name = "agent-evals-redteam-harness"
version = "0.1.0"
description = "AI Agent Evals & Red-Teaming Harness (AERTH): deterministic Evals, Benchmarks and Safety Testing for LLM agents."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "pydantic>=2.0",
    "pytest",
    "litellm",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[project.scripts]
aerth = "aerth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerth"]
